services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/quiznet.db
    ports:
      - "8000:8000"
    volumes:
      - quiznet-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  quiznet-data:
